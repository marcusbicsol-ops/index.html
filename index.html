<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EAF4E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111B15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ôn từ vựng">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BC%3C/text%3E%3C/svg%3E">
<title>Gấu trúc ôn từ vựng Hán ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap">
<style>
:root{
  --bg:#EAF4E1; --surface:#FFFFFF; --surface2:#F2F9EA; --ink:#25332A; --muted:#66796C; --line:#CDE2C2;
  --accent:#4C9A5F; --accent-dark:#367849; --accent-ink:#FFFFFF; --ok:#3E9B63; --ok-bg:#DDF3E3; --bad:#E0566F; --bad-bg:#FFE3E8;
  --seal:#E0566F; --grid:#D3E6C8; --pink:#FFB3C3; --bamboo:#8CC77E;
  --panda-w:#FFFFFF; --panda-b:#2A3530; --panda-edge:transparent;
  --ui:"Nunito","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --han:"Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111B15; --surface:#19271F; --surface2:#203126; --ink:#E8F2E6; --muted:#9BB09F; --line:#2D4636;
    --accent:#6DBB7E; --accent-dark:#4A9A5C; --accent-ink:#0E1F14; --ok:#7FD6A0; --ok-bg:#1E3D2B; --bad:#FF8CA0; --bad-bg:#432129;
    --seal:#FF8CA0; --grid:#2D4636; --pink:#9A5265; --bamboo:#4F8A52;
    --panda-w:#F4F8F1; --panda-b:#0F1612; --panda-edge:#4A6A53;
  }
}
:root[data-theme="dark"]{
  --bg:#111B15; --surface:#19271F; --surface2:#203126; --ink:#E8F2E6; --muted:#9BB09F; --line:#2D4636;
  --accent:#6DBB7E; --accent-dark:#4A9A5C; --accent-ink:#0E1F14; --ok:#7FD6A0; --ok-bg:#1E3D2B; --bad:#FF8CA0; --bad-bg:#432129;
  --seal:#FF8CA0; --grid:#2D4636; --pink:#9A5265; --bamboo:#4F8A52;
  --panda-w:#F4F8F1; --panda-b:#0F1612; --panda-edge:#4A6A53;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui);-webkit-text-size-adjust:100%}
.han{font-family:var(--han)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 56px}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.seal{width:36px;height:36px;background:var(--seal);color:#fff;font:700 21px/1 var(--han);display:grid;place-items:center;border-radius:4px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em}
h2{font-size:1rem;margin:0 0 8px;font-weight:600}

.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon:hover{border-color:var(--accent)}
.icon svg{width:18px;height:18px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding:4px 0 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;white-space:nowrap;font:inherit;font-weight:600;padding:11px 10px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--seal)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-h .sp{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip small{opacity:.8}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true]::before{content:"✓ "}
.chip-group{display:inline-flex;align-items:center}
.chip-group .chip{border-top-right-radius:0;border-bottom-right-radius:0}
.chip-x{font:inherit;font-size:.8rem;border:1px solid var(--line);border-left:0;background:var(--surface);color:var(--muted);padding:5px 9px;border-radius:0 999px 999px 0;cursor:pointer}
.chip-x:hover{color:var(--bad);border-color:var(--bad)}
.field-bar{display:flex;flex-direction:column;gap:8px}
.field-bar .lbl{font-size:.85rem;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools{display:flex;gap:8px;margin-bottom:10px}
input[type=search],input.ans,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
input[type=search]{flex:1;min-width:0}
input.ans{width:100%;font-size:1.2rem}
select{padding-right:8px}

.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row.open{border-color:var(--accent)}
.r-main{display:flex;gap:12px;align-items:flex-start}
.emo{font-size:1.6rem;line-height:1.3}
.r-text{flex:1;min-width:0}
.r-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.r-han{font:700 1.6rem/1.35 var(--han)}
.r-py{color:var(--accent);font-weight:500}
.r-ex{margin-top:4px;font:500 1rem/1.6 var(--han);color:var(--muted)}
.r-ph{color:var(--muted);font-size:.9rem}
.r-side{display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.on{background:var(--ok);border-color:var(--ok)}
.r-foot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

.tians{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tian{--s:min(92px,calc((100vw - 110px) / var(--n)));width:var(--s);height:var(--s);display:grid;place-items:center;
  font:700 calc(var(--s) * .66)/1 var(--han);border:2px solid var(--seal);
  background:
    linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,
    linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,
    linear-gradient(to top right,transparent calc(50% - .5px),var(--grid),transparent calc(50% + .5px)),
    linear-gradient(to bottom right,transparent calc(50% - .5px),var(--grid),transparent calc(50% + .5px)),
    var(--surface);
}
.fc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fc-meta .sp{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:340px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;user-select:none}
.card.flipped{border-color:var(--accent)}
.c-emo{font-size:2.6rem;line-height:1.1}
.c-py{font-size:1.5rem;color:var(--accent);font-weight:500}
.c-vi{font-size:1.25rem;font-weight:600}
.c-ex{font:500 1.15rem/1.6 var(--han)}
.c-hint{font-size:.78rem;color:var(--muted);margin-top:6px}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}

.q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-head .bar{flex:1}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-bottom:12px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.q-label{font-size:.9rem;color:var(--muted)}
.q-vi{font-size:1.4rem;font-weight:600}
.q-cloze{font:600 1.5rem/1.7 var(--han)}
.q-cloze u{text-decoration:none;border-bottom:3px solid var(--seal);padding:0 .3em;color:var(--seal)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:1rem;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;margin-bottom:8px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font:600 .8rem var(--ui);width:24px;height:24px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt.han span{font-family:var(--han);font-size:1.3rem;font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.type-row{display:flex;gap:8px;width:100%}
.type-row .btn{flex:none}
.fb{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px 14px;background:var(--surface);margin-top:4px}
.fb.ok{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.fb strong.ok{color:var(--ok)} .fb strong.bad{color:var(--bad)}
.fb-word{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;margin:6px 0}
.fb-word .big{font:700 1.5rem var(--han)}
.fb .btn{margin-top:8px;width:100%}
.setup-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.score{font:700 3rem/1 var(--ui);margin:6px 0}
.wrong-list .w{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.wrong-list .w .h{font:700 1.3rem var(--han)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-row .btn{flex:1;min-width:140px}
.foot{margin-top:20px;font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:90vw;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;z-index:40;background:rgba(24,36,47,.82);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:600}
#drop[hidden]{display:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(560px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog textarea{width:100%;min-height:200px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
dialog input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:.85em}
.timer{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:4px}
#tbar{height:100%;width:100%;background:var(--accent)}
#tbar.low{background:var(--bad)}
.tsec{text-align:right;font:600 .9rem var(--ui);color:var(--muted);margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sbox b{display:block;font-size:1.6rem;line-height:1.25}
.sbox span{font-size:.82rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;min-width:440px}
table.st th{text-align:left;font-weight:600;font-size:.82rem;color:var(--muted);padding:6px 8px}
table.st td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.st .h{font:700 1.3rem/1.3 var(--han)}
.st .sub{font-size:.85rem;color:var(--muted)}
.mini{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:60px;margin-top:4px}
.mini i{display:block;height:100%;background:var(--bad)}
.fail-word{font:700 2.6rem/1.2 var(--han)}
.tm-filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stat-pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.85rem}
.tm-idle{text-align:center;padding:26px 16px;background:var(--surface);border:2px solid var(--line);border-radius:20px}
.tm-title{font:700 42px/1.2 var(--han);color:var(--ok);letter-spacing:4px}
.tm-modes{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:16px auto 0;text-align:left}
.tm-radio{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.tm-radio input{accent-color:var(--accent)}
.tm-split{display:none;padding:10px 14px;background:var(--surface2);border-radius:14px;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;font-weight:600}
.tm-split input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tm-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center}
.tm-hanzi{font:700 60px/1.25 var(--han);color:var(--seal);margin-top:6px}
.tm-py{font:700 18px var(--ui);color:var(--accent);margin-top:2px;min-height:1.5em}
.hide-py .tm-py{visibility:hidden}
.tm-bar-wrap{width:100%;height:14px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;overflow:hidden;margin:18px 0 6px}
.tm-bar{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:999px;transition:width .05s linear}
.tm-num{font:700 13px ui-monospace,Menlo,Consolas,monospace;text-align:right;color:var(--seal)}
.tm-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media (max-width:480px){.tm-options{grid-template-columns:1fr}}
.tm-opt{font:700 15px/1.35 var(--ui);color:var(--ink);padding:16px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;transition:transform .15s,border-color .15s}
.tm-opt:hover{transform:translateY(-2px);border-color:var(--ok)}
.tm-opt.correct{background:var(--ok);border-color:var(--ok);color:#fff}
.tm-opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ===== giao diện gấu trúc ===== */
body{background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.3px,transparent 1.5px);background-size:24px 24px}
.wrap{position:relative;z-index:1}
h1{font:800 1.35rem/1.05 var(--display);color:var(--ink)}
h1 small{display:block;font:700 .74rem var(--ui);color:var(--muted);margin-top:2px}
h2{font-family:var(--display);font-weight:700;font-size:1.1rem}
.logo{width:46px;height:46px;flex:none}
.panda{display:block}
.p-b{fill:var(--panda-b)} .p-w{fill:var(--panda-w)}
.p-ear{fill:var(--panda-b);stroke:var(--panda-edge);stroke-width:2}
.p-head{fill:var(--panda-w);stroke:var(--panda-b);stroke-width:2.6}
.p-ws{fill:none;stroke:var(--panda-w);stroke-width:3.4;stroke-linecap:round}
.p-line{fill:none;stroke:var(--panda-b);stroke-width:2.6;stroke-linecap:round}
.p-mouth{fill:#C4455E}
.p-blush{fill:var(--pink);opacity:.9}

.bamboo{position:fixed;bottom:0;height:62vh;width:64px;z-index:0;pointer-events:none;opacity:.6}
.bamboo svg{width:100%;height:100%;display:block}
.bamboo-l{left:0} .bamboo-r{right:0;transform:scaleX(-1)}
@media (max-width:760px){.bamboo{display:none}}

.hero{display:flex;align-items:center;gap:14px;margin:2px 0 10px}
.hero-panda{flex:none;width:68px;height:68px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;font-size:.93rem;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:13px;height:13px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.big-panda{display:grid;place-items:center;margin-bottom:6px}

.btn{border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;transition:transform .08s,box-shadow .08s,border-color .15s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent-dark);box-shadow:0 3px 0 var(--accent-dark);color:var(--accent-ink)}
.btn.good{background:var(--accent);border-color:var(--accent-dark);box-shadow:0 3px 0 var(--accent-dark);color:var(--accent-ink)}
.btn.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.small{border-radius:12px;box-shadow:0 2px 0 var(--line)}
.btn.small.primary,.btn.small.good{box-shadow:0 2px 0 var(--accent-dark)}
.icon{border-width:2px;box-shadow:0 2px 0 var(--line)}

.tabs{gap:6px;padding:8px 2px 12px;border-bottom:0;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tabs button{flex:0 0 auto;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:8px 14px;margin:0;box-shadow:0 3px 0 var(--line);font-weight:800}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent-dark);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dark)}

.panel,.row,.q-card,.tm-box,.sbox,.fb{border-width:2px;border-radius:18px;box-shadow:0 3px 0 var(--line)}
.tm-idle{border-radius:24px;box-shadow:0 4px 0 var(--line)}
.row:hover,.row.open{border-color:var(--accent)}

/* ===== Tối ưu cho Windows / iPhone / iPad ===== */
:root{
  color-scheme:light dark;
  --ui:"Nunito","Be Vietnam Pro","Segoe UI Variable Text","Segoe UI","SF Pro Text",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;

}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent;overflow-wrap:break-word}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,[data-act],.tabs button{touch-action:manipulation}
.card,.opt,.tm-opt,.btn,.chip,.tabs button,.tm-hanzi{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card:focus:not(:focus-visible),.row:focus:not(:focus-visible){outline:none}

/* thanh tab: cuộn mượt trên cảm ứng, tự xuống dòng khi màn đủ rộng */
.tabs{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.tabs button{scroll-snap-align:center}
@media (min-width:700px){.tabs{flex-wrap:wrap;overflow:visible}}

/* hộp thoại & thông báo */
dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;overscroll-behavior:contain}
dialog textarea{min-height:min(200px,30dvh);resize:vertical}
#toast{max-width:min(90vw,520px)}
.tbl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}

/* tre trang trí chỉ hiện khi đủ chỗ hai bên */
.bamboo{display:none}
@media (min-width:1180px){.bamboo{display:block}}

/* ---------- điện thoại (iPhone) ---------- */
@media (max-width:520px){
  .brand{flex:1 0 100%}
  .top .btn{flex:1 1 0}

  .btn-row .btn{min-width:0;flex:1 1 100%}
  .fc-actions .btn small{display:none}
  table.st{min-width:400px}
}
@media (max-width:380px){

  .bubble{font-size:.88rem;padding:8px 12px}

  .tm-box{padding:14px}
  .tm-hanzi{font-size:44px}
  .hero{display:none}
}

/* ---------- máy tính bảng (iPad) ---------- */
@media (min-width:700px){
  .tian{--s:min(110px,calc((min(100vw,860px) - 160px) / var(--n)))}

/* ---------- máy tính (Windows) ---------- */
@media (min-width:1024px){
  .wrap{max-width:1040px;padding-top:24px}

}

:root[data-theme="dark"] .btn.star-btn.on{color:#FFD25A}

.row.starred,.card.starred{position:relative;overflow:hidden;border-color:#F5B301;animation:starPulse 2.4s ease-in-out infinite}
.row.starred{background:linear-gradient(135deg,color-mix(in srgb,#F5B301 14%,var(--surface)),var(--surface) 55%)}

.card.starred::before{content:"⭐";position:absolute;top:12px;right:16px;font-size:1.4rem;filter:drop-shadow(0 0 6px rgba(245,179,1,.9));animation:starTwinkle 2.4s ease-in-out infinite}
.card.starred.flipped{border-color:#F5B301}
@keyframes starPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(245,179,1,.35),0 0 10px rgba(245,179,1,.35),0 3px 0 var(--line)}
  50%{box-shadow:0 0 0 2px rgba(245,179,1,.55),0 0 24px rgba(245,179,1,.75),0 3px 0 var(--line)}}
@keyframes starSweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes starTwinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(8deg)}}
.star-panel{border-color:#F5B301;box-shadow:0 0 18px rgba(245,179,1,.35),0 3px 0 var(--line)}

/* ---------- đọc CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const cnt = { ',': 0, '\t': 0, ';': 0 };
  for (const c of first) if (c in cnt) cnt[c]++;

  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const normH = s => s.toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\u4e00-\u9fff]/g, '');
const ALIAS = {
  han: ['hantu', 'han', 'hanzi', 'chuhan', 'tuvung', 'tu', 'word', '汉字', '漢字'],
  py: ['pinyin', 'phienam', 'pronunciation'],
  vi: ['nghia', 'nghiatiengviet', 'meaning', 'vietnamese', 'dich'],
  emoji: ['emoji', 'icon', 'hinh'],
  list: ['list', 'bai', 'lesson', 'nhom', 'deck', 'chude', 'bo'],
  ex: ['cauvidu', 'vidu', 'example', 'cau', 'sentence', 'examplesentence'],
  folder: ['thumuc', 'folder', 'thumucchinh', 'nhomlon']
};
const KEYS = ['han', 'py', 'vi', 'emoji', 'list', 'ex', 'folder'];
function rowsToWords(rows, defList) {
  if (!rows.length) return [];
  const head = rows[0].map(normH); const idx = {};
  KEYS.forEach(k => { const i = head.findIndex(h => ALIAS[k].includes(h)); if (i >= 0) idx[k] = i; });
  let start = 1;
  if (idx.han === undefined) { KEYS.forEach((k, i) => idx[k] = i); start = 0; }
  const out = [];
  for (let r = start; r < rows.length; r++) {
    const g = k => idx[k] === undefined ? '' : (rows[r][idx[k]] || '').trim();
    const w = { han: g('han'), py: g('py'), vi: g('vi'), emoji: g('emoji'), list: g('list') || defList, ex: g('ex'), folder: g('folder') };
    if (!w.han) continue;
    w.id = w.list + '|' + w.han + '|' + w.ex;
    if (!w.folder) delete w.folder;
    out.push(w);
  }
  return out;
}

function addCSV(text, defList) {
  const ws = rowsToWords(parseCSV(text), defList);
  const byId = new Map(S.words.map(w => [w.id, w])); let added = 0, upd = 0;
  const newLists = new Set();
  ws.forEach(w => { if (w.folder) putInFolder(w.folder, w.list); delete w.folder; if (byId.has(w.id)) { Object.assign(byId.get(w.id), w); upd++; } else { S.words.push(w); byId.set(w.id, w); added++; newLists.add(w.list); } });
  if (S.prefs.scope) newLists.forEach(l => { if (!S.prefs.scope.includes(l)) S.prefs.scope.push(l); });

}
async function importFiles(files) {

  for (const f of files) {

}

  if (qz.phase !== 'setup') qz = { phase: 'setup' };
  saveWords(); saveProg(); savePrefs(); keepDeck();
  toast('Đã xóa từ “' + w.han + '”.');
  render();
};
document.addEventListener('submit', e => { if (e.target.id === 'editForm') { e.preventDefault(); ACT.editok(); } });
/* ---------- xuất CSV / xuất HTML kèm từ vựng ---------- */
function downloadFile(name, text, type) {
  const b = new Blob([text], { type }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
ACT.exportcsv = function () {
  if (!S.words.length) { toast('Chưa có từ nào để xuất.'); return; }
  const rows = S.words.map(w => [w.han, w.py, w.vi, w.emoji, w.list, w.ex, (FOLDERS.find(f => f.lists.includes(w.list)) || {}).name || ''].map(csvCell).join(','));
  downloadFile('tu-vung.csv', '\uFEFFHan_tu,Pinyin,Nghia,Emoji,List,Cau_vi_du,Thu_muc\r\n' + rows.join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
  toast('Đã tạo file CSV ' + S.words.length + ' từ.');
};
ACT.exporthtml = function () {
  if (!S.words.length) { toast('Chưa có từ nào để xuất.'); return; }
  const re = /(<script id="hv-embed" type="application\/json">)[\s\S]*?(<\/script>)/;
  if (!re.test(PAGE_SRC)) { toast('Không tạo được file HTML. Hãy thử lại sau khi tải lại trang.'); return; }
  const data = { v: Date.now(), words: S.words.map(w => ({ han: w.han, py: w.py, vi: w.vi, emoji: w.emoji, list: w.list, ex: w.ex, star: starred(w.id) ? 1 : 0 })), folders: FOLDERS.map(f => ({ name: f.name, lists: f.lists.filter(l => S.words.some(w => w.list === l)) })) };
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  downloadFile('on-tu-vung.html', PAGE_SRC.replace(re, (m, a, b) => a + json + b), 'text/html;charset=utf-8');
  toast('Đã tạo file HTML kèm ' + S.words.length + ' từ. Gửi file này sang iPad.');
};
/* ---------- tab "Từ có sao" ---------- */
const starredWords = () => scopeWords().filter(w => starred(w.id));
function renderStar() {
  const ws = starredWords(), total = S.words.filter(w => starred(w.id)).length;
  if (!ws.length) {
    $('#view').innerHTML = `<div class="panel" style="text-align:center;padding:28px 16px"><div class="big-panda">${panda('wow', 96)}</div><h2>Chưa có từ nào gắn sao</h2>
      <p class="muted">Bấm ngôi sao ☆ cạnh một từ ở tab Danh sách (hoặc dưới thẻ ghi nhớ) để gom các từ khó nhớ vào đây.${total ? ' Hiện có ' + total + ' từ gắn sao ở các bộ chưa được chọn.' : ''}</p>
      <div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="tab" data-v="browse" style="flex:none">Đến tab Danh sách</button></div></div>`;
    return;
  }
  const armed = S.confirm === '__star';
  $('#view').innerHTML = `<div class="panel star-panel"><div class="panel-h"><h2 style="margin:0">⭐ Từ có sao</h2><span class="muted">${ws.length} từ trong các bộ đang chọn</span></div>
      <div class="btn-row" style="margin-top:4px">
        <button class="btn primary" data-act="starcards">🎴 Ôn bằng thẻ</button>
        <button class="btn" data-act="starquiz">📝 Kiểm tra</button>
        <button class="btn" data-act="starch" ${ws.length < 4 ? 'disabled title="Cần ít nhất 4 từ"' : ''}>⚡ Thử thách giờ</button>
        <button class="btn bad ${armed ? 'armed' : ''}" data-act="starclear">${armed ? 'Bấm lần nữa để bỏ hết sao' : 'Bỏ hết sao'}</button>
      </div></div>` +
    fieldBar('Các trường hiển thị (bấm vào từng từ để xem đủ tất cả các trường)') +
    `<div class="tools"><input id="search" type="search" placeholder="Tìm trong các từ có sao…" value="${esc(q)}" aria-label="Tìm từ"><button class="btn" data-act="toggleall">${openAll ? 'Thu gọn hết' : 'Mở hết'}</button></div><div id="rows"></div>`;
  renderRows();
}
ACT.star = function (id) {
  if (!id) return;
  const on = !STARS[id];
  if (on) STARS[id] = 1; else delete STARS[id];
  saveStars();
  say(on ? 'cheer' : 'happy', on ? 'Đã gắn sao ⭐ Từ này sẽ sáng lên nhé!' : 'Đã bỏ sao.', 1800);
  if (S.prefs.tab === 'browse') renderRows(); else renderView();
};
ACT.starclear = function () {
  if (S.confirm === '__star') {
    starredWords().forEach(w => delete STARS[w.id]); saveStars(); S.confirm = null; toast('Đã bỏ sao các từ trong bộ đang chọn.'); renderView();
  } else {
    S.confirm = '__star'; renderView();
    setTimeout(() => { if (S.confirm === '__star') { S.confirm = null; if (S.prefs.tab === 'star') renderView(); } }, 3000);
  }
};
ACT.starcards = function () {
  const ws = starredWords(); if (!ws.length) return;
  fc = { sig: 'custom', ids: ws.map(w => w.id), i: 0, flip: false, yes: 0 };
  S.prefs.tab = 'cards'; savePrefs(); renderTabs(); renderView();
};
ACT.starquiz = function () {
  const ws = starredWords(); if (!ws.length) return;
  S.prefs.tab = 'quiz'; savePrefs(); renderTabs(); startQuiz(ws);
};
ACT.starch = function () {
  const ws = starredWords(); if (ws.length < 4) return;
  S.prefs.tab = 'challenge'; savePrefs(); renderTabs(); chBegin(ws, 'star');
};
/* ---------- thư mục: giao diện & hành động ---------- */
function listChip(n, c, s) {
  return `<span class="chip-group"><button class="chip" aria-pressed="${s.includes(n)}" data-act="scope" data-v="${esc(n)}">${esc(n)} <small>${c}</small></button><button class="chip-x" data-act="dellist" data-v="${esc(n)}" aria-label="Xoá bộ ${esc(n)}">${S.confirm === n ? 'Xoá?' : '×'}</button></span>`;
}
function renderScope() {
  const ls = lists(); if (!ls.length) { $('#scope').innerHTML = ''; return; }
  const s = sel(), sw = scopeWords(), known = sw.filter(w => prog(w.id).known).length, cnt = new Map(ls), filed = new Set();
  const folders = FOLDERS.map(f => {
    const fl = f.lists.filter(l => cnt.has(l)); fl.forEach(l => filed.add(l));
    const on = fl.filter(l => s.includes(l)).length, all = fl.length > 0 && on === fl.length, total = fl.reduce((a, l) => a + cnt.get(l), 0);
    const armed = S.confirm === 'f:' + f.id, id = esc(f.id);
    return `<div class="folder ${f.open ? 'open' : ''} ${all ? 'all' : on ? 'part' : ''}">
      <div class="folder-h">
        <button class="folder-t" data-act="ftoggle" data-v="${id}" aria-expanded="${!!f.open}"><span class="caret" aria-hidden="true">▸</span><span>📁 <b>${esc(f.name)}</b></span><small class="muted">${fl.length} list · ${total} từ${on ? ' · đang chọn ' + on : ''}</small></button>
        <button class="btn small ${all ? 'primary' : ''}" data-act="fscope" data-v="${id}" ${fl.length ? '' : 'disabled'}>${all ? '✓ Đã chọn' : 'Chọn cả thư mục'}</button>
      </div>
      ${f.open ? `<div class="chips folder-body">${fl.length ? fl.map(n => listChip(n, cnt.get(n), s)).join('') : '<span class="muted">Thư mục trống. Bấm “Sửa thư mục” để thêm list vào.</span>'}</div>
      <div class="folder-act"><button class="btn small" data-act="fonly" data-v="${id}" ${fl.length ? '' : 'disabled'}>Chỉ ôn thư mục này</button><button class="btn small" data-act="fedit" data-v="${id}">✏️ Sửa thư mục</button><button class="btn small bad ${armed ? 'armed' : ''}" data-act="fdel" data-v="${id}">${armed ? 'Bấm lần nữa để xóa' : '🗑️ Xóa thư mục'}</button></div>` : ''}
    </div>`;
  }).join('');
  const loose = ls.filter(([n]) => !filed.has(n));
  $('#scope').innerHTML = `<div class="panel">
    <div class="panel-h"><h2 style="margin:0">Bộ từ đang ôn</h2><span class="muted">${sw.length} từ · đã nhớ ${known}</span>
      <button class="btn small" data-act="fnew">📁 Tạo thư mục</button>
      <button class="btn small ghost sp" data-act="selall">Chọn tất cả</button></div>
    ${folders}
    ${loose.length ? (FOLDERS.length ? '<div class="loose-h">Chưa vào thư mục</div>' : '') + `<div class="chips">${loose.map(([n, c]) => listChip(n, c, s)).join('')}</div>` : ''}
  </div>`;
}
function setScope(arr) { S.prefs.scope = arr; savePrefs(); fc.sig = null; qz = { phase: 'setup' }; chStop(); ch = { phase: 'idle' }; render(); }
const folderLists = id => { const f = FOLDERS.find(x => x.id === id), ex = new Set(lists().map(x => x[0])); return f ? f.lists.filter(l => ex.has(l)) : []; };
ACT.ftoggle = function (id) { const f = FOLDERS.find(x => x.id === id); if (!f) return; f.open = !f.open; saveFolders(); renderScope(); };
ACT.fscope = function (id) {
  const fl = folderLists(id); if (!fl.length) return;
  const s = sel(), all = fl.every(l => s.includes(l));
  setScope(all ? s.filter(x => !fl.includes(x)) : [...new Set([...s, ...fl])]);
};
ACT.fonly = function (id) { const fl = folderLists(id); if (fl.length) setScope(fl); };
let fdId = null;
function openFolderDlg(id) {
  const f = id ? FOLDERS.find(x => x.id === id) : null; if (id && !f) return;
  fdId = id; const mine = new Set(f ? f.lists : []);
  $('#fdTitle').textContent = f ? 'Sửa thư mục' : 'Tạo thư mục';
  $('#fdName').value = f ? f.name : '';
  $('#fdLists').innerHTML = lists().map(([n, c]) => {
    const o = FOLDERS.find(x => x.lists.includes(n)), where = o && (!f || o.id !== f.id) ? ' · đang ở “' + esc(o.name) + '”' : '';
    return `<label class="check"><input type="checkbox" data-l="${esc(n)}" ${mine.has(n) ? 'checked' : ''}><span>${esc(n)} <small class="muted">· ${c} từ${where}</small></span></label>`;
  }).join('');
  $('#fdErr').hidden = true; $('#folderDlg').showModal();
  if (!f) setTimeout(() => $('#fdName').focus(), 0);
}
ACT.fnew = function () { openFolderDlg(null); };
ACT.fedit = function (id) { openFolderDlg(id); };
ACT.fcancel = function () { $('#folderDlg').close(); fdId = null; };
ACT.fsave = function () {
  const err = m => { const e = $('#fdErr'); e.textContent = m; e.hidden = false; };
  const name = $('#fdName').value.trim();
  if (!name) { err('Hãy đặt tên cho thư mục.'); $('#fdName').focus(); return; }
  if (FOLDERS.some(x => x.id !== fdId && x.name.toLowerCase() === name.toLowerCase())) { err('Đã có thư mục tên này. Hãy đặt tên khác.'); return; }
  const picked = [...document.querySelectorAll('#fdLists input:checked')].map(i => i.dataset.l);
  let f = fdId ? FOLDERS.find(x => x.id === fdId) : null;
  if (!f) { f = { id: newFolderId(), name, lists: [], open: true }; FOLDERS.push(f); }
  f.name = name;
  FOLDERS.forEach(x => { if (x !== f) x.lists = x.lists.filter(l => !picked.includes(l)); });
  f.lists = picked;
  saveFolders(); $('#folderDlg').close(); fdId = null;
  toast('Đã lưu thư mục “' + name + '” (' + picked.length + ' list).'); renderScope();
};
ACT.fdel = function (id) {
  const f = FOLDERS.find(x => x.id === id); if (!f) return;
  const key = 'f:' + id;
  if (S.confirm !== key) { S.confirm = key; renderScope(); setTimeout(() => { if (S.confirm === key) { S.confirm = null; renderScope(); } }, 3000); return; }
  S.confirm = null; FOLDERS.splice(FOLDERS.indexOf(f), 1); saveFolders();
  toast('Đã xóa thư mục “' + f.name + '”. Các list bên trong vẫn được giữ.'); renderScope();
};
document.addEventListener('submit', e => { if (e.target.id === 'folderForm') { e.preventDefault(); ACT.fsave(); } });
$('#logo').innerHTML = panda('happy', 46);
render();
